<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPL RAG Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Fraunces:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1418;
            --panel: #171d23;
            --panel-2: #1e262e;
            --accent: #f97316;
            --accent-2: #fbbf24;
            --text: #eef2f5;
            --muted: #8a97a3;
            --border: #262f38;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            background:
              radial-gradient(1200px 500px at 85% -10%, rgba(249,115,22,0.10), transparent 60%),
              radial-gradient(900px 400px at -10% 110%, rgba(251,191,36,0.08), transparent 60%),
              var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }
        .app {
            width: 100%;
            max-width: 780px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        header { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; }
        header h1 {
            margin: 0;
            font-family: 'Fraunces', serif;
            font-weight: 800;
            font-size: 34px;
            letter-spacing: -0.02em;
        }
        header h1 span { color: var(--accent); }
        header .tag { color: var(--muted); font-size: 12px; }
        .chatbox {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 60px -30px rgba(0,0,0,0.6);
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 6px 4px 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; }
        .msg.user { align-self: flex-end; background: var(--accent); color: #1a1006; border-bottom-right-radius: 4px; font-weight: 600; }
        .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg.error { align-self: flex-start; background: #3a1414; border: 1px solid #7f1d1d; color: #fecaca; }
        .doc {
            background: #12181d;
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 8px;
        }
        .doc .team {
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--accent-2);
            margin-bottom: 4px;
        }
        .doc .content { color: #cbd3da; font-size: 13px; line-height: 1.55; }
        .empty { color: var(--muted); text-align: center; padding: 60px 20px; font-size: 13px; }
        .empty .hint { margin-top: 8px; font-size: 11px; opacity: 0.7; }
        form {
            display: flex;
            gap: 10px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        input[type="text"] {
            flex: 1;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            background: var(--accent);
            color: #1a1006;
            border: 0;
            padding: 0 18px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover:not(:disabled) { background: var(--accent-2); }
        button:active:not(:disabled) { transform: scale(0.97); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .thinking { display: inline-flex; gap: 4px; align-items: center; }
        .thinking span {
            width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .thinking span:nth-child(2) { animation-delay: 0.15s; }
        .thinking span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
            40% { transform: translateY(-4px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>IPL<span>.rag</span></h1>
            <div class="tag">spring-boot × langchain × chroma</div>
        </header>

        <div class="chatbox">
            <div class="messages" id="messages" data-testid="messages-container">
                <div class="empty" id="empty">
                    Ask anything about IPL teams, players, captains or playing styles.
                    <div class="hint">e.g. "Which team has a strong Indian all-rounder with spin bowling?"</div>
                </div>
            </div>

            <form id="chat-form" data-testid="chat-form">
                <input
                    type="text"
                    id="prompt"
                    data-testid="prompt-input"
                    placeholder="Type your prompt..."
                    autocomplete="off"
                    required
                />
                <button type="submit" id="send-btn" data-testid="send-btn">Send</button>
            </form>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const emptyEl = document.getElementById('empty');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('prompt');
        const sendBtn = document.getElementById('send-btn');

        function addUserMessage(text) {
            if (emptyEl) emptyEl.remove();
            const div = document.createElement('div');
            div.className = 'msg user';
            div.setAttribute('data-testid', 'user-message');
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addThinking() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.id = 'thinking';
            div.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function removeThinking() {
            const t = document.getElementById('thinking');
            if (t) t.remove();
        }

        function addBotResponse(data) {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.setAttribute('data-testid', 'bot-message');
            const header = document.createElement('div');
            header.textContent = 'Top matches from the vector store:';
            header.style.fontSize = '12px';
            header.style.color = 'var(--muted)';
            header.style.marginBottom = '6px';
            div.appendChild(header);

            (data.results || []).forEach((r, idx) => {
                const d = document.createElement('div');
                d.className = 'doc';
                d.setAttribute('data-testid', 'result-doc-' + idx);
                const team = document.createElement('div');
                team.className = 'team';
                team.textContent = r.team;
                const content = document.createElement('div');
                content.className = 'content';
                content.textContent = r.content;
                d.appendChild(team);
                d.appendChild(content);
                div.appendChild(d);
            });
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addError(msg) {
            const div = document.createElement('div');
            div.className = 'msg error';
            div.setAttribute('data-testid', 'error-message');
            div.textContent = msg;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const prompt = input.value.trim();
            if (!prompt) return;

            addUserMessage(prompt);
            input.value = '';
            sendBtn.disabled = true;
            addThinking();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, k: 3 })
                });
                removeThinking();
                if (!res.ok) {
                    const errBody = await res.json().catch(() => ({}));
                    addError(errBody.error || ('Request failed: ' + res.status));
                    return;
                }
                const data = await res.json();
                addBotResponse(data);
            } catch (err) {
                removeThinking();
                addError('Network error: ' + err.message);
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
